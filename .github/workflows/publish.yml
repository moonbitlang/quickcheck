name: publish-package
run-name: publish to mooncakes
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: publish-mooncakes
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MOON_WORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- nightly
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon update
      - run: moon check --target all --deny-warn
      - run: moon test --target all
      - run: moon test --target all --release
      - name: Publish verified module
        env:
          MOONCAKES_CREDENTIALS: ${{ secrets.MOONCAKES_MOONBITLANG_TOKEN }}
        run: |
          test -n "$MOONCAKES_CREDENTIALS" || { echo "Missing organization Mooncakes publishing credentials"; exit 1; }
          trap 'rm -f "$HOME/.moon/credentials.json"' EXIT
          printf '%s' "$MOONCAKES_CREDENTIALS" > "$HOME/.moon/credentials.json"
          moon publish --dry-run
          moon publish
